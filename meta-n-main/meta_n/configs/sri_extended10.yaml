# SRI formal profile -- EXTENDED robustness cohort (design 2026-09-20, §3.2/§12)
#
# The primary six PLUS Crew / Flow shop / Hybrid Reentrant / Job shop.
# This cohort is reported SEPARATELY and can never replace the primary cohort
# after results are observed (§3.2). Validated against `protocol.EXTENDED10`.
name: sri_extended10
cohort:
  - Aircraft landing
  - Assignment problem
  - Assortment problem
  - Bin packing - one-dimensional
  - Capacitated warehouse location
  - Common due date scheduling
  - Crew scheduling
  - Flow shop scheduling
  - Hybrid Reentrant Shop Scheduling
  - Job shop scheduling

beam_width: 2
beam_candidates: 2
max_iterations: 6
max_depth: 6
no_early_stop: true

search_seeds: [0, 1, 2, 3, 4]
search_eval_repeats: 3
audit_repeats: 3
test_repeats: 3

# Generation knobs -- pinned here for the same reason as in sri_primary6: the
# runner renders the command from this file and then verifies config.json.
max_tokens: 1024
empty_retry_max_tokens: 0
max_retries: 0
reasoning_effort: low
temperatures: [0.5, 0.7, 0.9]
novelty_alpha: 0.3

# Execution concurrency -- PINNED because it is result-affecting for
# CO-Bench: a task's dev score is "#instances finishing inside the 10s
# timeout / #instances", so a different worker count means a different
# score from the same script (measured: assignment_problem 0.5000 at the
# search's resolved 8, 0.2500 at a contended setting). 1 keeps every
# instance unshared and minimises load-driven timeouts.
# 0 is refused: it would resolve to cpu_count, i.e. machine-dependent.
parallel: 1
instance_workers: 1

# consolidate=true SKIPS the gate, so gate_tasks must be 0 (a profile that
# claims an active gate that can never run is refused at load).
consolidate: true
gate_tasks: 0
gate_repeats: 1
gate_margin: 0.0
protect_floor: null
regression_guard: true
regression_guard_repeats: 3
within_task_recursion: true
focus_current_headroom: true
symmetric_trace_sampling: true
paired_eval: false
elite_rotation: false
benchmark_config: none

regression_threshold: 0.02

# NOT deterministic -- measured on the real dev split, see sri_primary6.yaml for
# the numbers. Repeats are real repeat measurements, never cacheable shortcuts.
deterministic_evaluator_caches_repeats: false
