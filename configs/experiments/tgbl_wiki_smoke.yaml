# Smoke matrix: one epoch, one seed, all five compressor variants.
# Engineering smoke only -- never report these numbers as research results.
name: tgbl_wiki_smoke
root: outputs/tgbl_wiki_smoke
defaults:
  dataset: tgbl-wiki
  epochs: 1
  bs: 200
  lr: 0.0001
  patience: 1
  n_neighbors: 10
  mem_dim: 100
  time_dim: 100
  emb_dim: 100
  candidate_dim: 256
  candidate_hidden: 128
  context_dim: 64
  reader_hidden: 128
  lambda_resp: 1.0
  lambda_spec: 0.1
  gram_ema: 0.05
  spectral_warmup: 50
  spectral_interval: 50
  spectral_step_size: 0.25
  trace_roots: 8
  grad_clip: 0.0
  freeze_host: false
  monitor_every: 50
matrix:
  dataset: [tgbl-wiki]
  variant: [vanilla, random, pca, direct, spectral]
  seed: [0]
