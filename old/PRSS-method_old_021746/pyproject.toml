[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "predictive-relation-state-sheaf"
version = "0.1.0"
description = "Predictive Relation-State Sheaf: continuation-aware spectral state selection for recursive models"
requires-python = ">=3.9"
dependencies = ["torch>=1.12", "numpy>=1.21,<2.0", "pandas>=1.3", "scikit-learn>=1.0", "tensorboard>=2.10", "matplotlib>=3.5"]

[tool.setuptools.packages.find]
include = ["prss*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
