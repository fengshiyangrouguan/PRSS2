[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "prss2"
version = "3.0.0"
description = "RPBE: predictive recursive compression via a Ky Fan spectral score on recursive temporal graph hosts"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.21",
  "pandas>=1.5",
  "scikit-learn>=1.2",
  "pyyaml>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["test"]
