# @package _global_
#
# MSC CCM-merge Stage-1 (official adapter training, review 2026-09-20).
# Frozen budget: 1000 optimizer updates.  macrobatch stays 128 samples
# per update, but the per-device batch is raised to 4 (grad accum 32)
# for throughput on the A800 — the RPBE machinery does not run here.
# Checkpoints every 250 steps; the merged model c*_merge is selected by
# validation S2-S4 session-opening PPL (train_msc --eval).

defaults:
  - data

training:
  fp16: true
  fp16_full_eval: true

  per_device_train_batch_size: 4
  gradient_accumulation_steps: 32

  per_device_eval_batch_size: 4
  generation_max_length: 3072  # this includes the prompt length

  learning_rate: 3.0e-4
  lr_scheduler_type: cosine
  warmup_ratio: 0.03
  weight_decay: 0.0

  peft: true
  peft_type: lora
  lora_r: 8
  target_modules: q_proj,k_proj,v_proj,o_proj

  logging_steps: 10
  save_steps: 50    # keeps checkpoint-250/500/700/750/1000 (each ~15MB, trainable only)
  eval_steps: 250
  save_total_limit: 0   # keep ALL checkpoints (c*_merge selection needs them)

  max_steps: 1000
