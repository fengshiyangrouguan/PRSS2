name: tests

# Every push/PR runs the suite on a current torch so a "tests pass" claim is
# checkable from the repo rather than from a local console.  torch is installed
# separately: requirements.txt deliberately leaves it to the environment.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run tests
        run: python -m pytest test/ -q
