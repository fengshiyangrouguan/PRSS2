[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "prss2"
version = "2.0.0"
description = "Predictive Recursive State Sheaf: predictive spectral quotient compression for recursive temporal graph hosts"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.21",
  "pandas>=1.5",
  "scikit-learn>=1.2",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
tgb = ["tgb==2.3.0", "torch-geometric==2.3.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["test"]
