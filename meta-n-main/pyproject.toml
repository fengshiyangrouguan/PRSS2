[project]
name = "meta-n"
version = "0.2.0"
description = "Meta^n: Recursive Self-Improving Agent Framework"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "openai>=1.0",
    "httpx>=0.25",
    "rich>=13.0",
    # NOTE: the `docker` pip package is deliberately NOT a dependency — the
    # terminal_bench integration drives the Docker CLI via subprocess only.
    # numpy is required by meta_n/integrations/arc_agi.py at top-level
    # import time; without it `--benchmark arc_agi_2` fails on a clean
    # `pip install -e .`. Other integrations only need it transitively
    # via the [openevolve] extra.
    "numpy>=1.24",
    # pyyaml is a CORE dependency: meta_n.main loads the bundled
    # meta_n/configs/benchmark_features.yaml BY DEFAULT (the metacognition
    # stack is turned on via that file), so `import yaml` must resolve on a
    # clean `pip install -e .`. It also remains listed under the [openevolve]
    # extras.
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]
# `pulp` provides the CBC MILP solver that CO-Bench task prompts explicitly
# suggest ("you might use an integer programming solver (e.g., PuLP, ...)").
# Without it, any solver that follows that hint dies with
# `No module named 'pulp'` and scores 0 across all subtasks — a silent
# environment gap that unfairly zeroed the self_refine baseline in smoke runs.
bench = ["networkx>=3.0", "psutil>=5.9", "pulp>=2.8"]
classify = ["datasets>=2.0"]
analysis = ["matplotlib", "seaborn", "scikit-learn", "sentence-transformers", "pandas"]
harbor = ["harbor>=0.5"]
openevolve = ["numpy>=1.24", "scipy>=1.11", "pyyaml>=6.0"]
openevolve-jax = ["numpy>=1.24", "scipy>=1.11", "pyyaml>=6.0", "jax>=0.4", "optax>=0.1", "sympy>=1.12"]
# External-agent backends. Each extra pins the SDK and is meant to be installed
# WITH the matching constraints lock so the transitive tree is reproducible:
#   pip install -e ".[terminus2]"  -c constraints/terminal-bench.lock.txt
#   pip install -e ".[openhands]"  -c constraints/openhands-1.31.0.lock.txt
# NOTE: the constraints/*.lock.txt files are GENERATED by
# scripts/install_external_agents.sh (which pip-compiles the pinned trees) and
# must be committed before the `-c <lock>` install lines above resolve.
# meta_n/core/external_agents imports these SDKs lazily inside methods, so the
# package still imports cleanly when neither extra is installed.
terminus2 = ["terminal-bench"]
# OpenHands requires the full pinned TRIPLE — sdk + agent-server + tools, all at
# 1.31.0 (the backend's live REST/in-process paths import all three; installing
# only the sdk leaves agent-server/tools missing and fails at runtime).
openhands = [
    "openhands-sdk==1.31.0",
    "openhands-agent-server==1.31.0",
    "openhands-tools==1.31.0",
]

[project.scripts]
meta-n = "meta_n.main:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["meta_n*"]

# meta_n/configs/benchmark_features.yaml is package data (not a subpackage):
# meta_n.main resolves --benchmark-config 'auto' package-relatively, so the
# file must ship inside the wheel/sdist for installed (non-editable) runs.
[tool.setuptools.package-data]
meta_n = ["configs/*.yaml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "slow: tests that take more than a few seconds (e.g., subprocess timeouts)",
]
