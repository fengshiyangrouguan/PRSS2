name: tests

# Every push/PR runs the suite on a current torch so a "tests pass" claim is
# checkable from the repo rather than from a local console.  torch is installed
# separately (requirements.txt deliberately leaves it to the environment) with
# an explicit range: the suite needs >=2.1 for
# xavier_normal_(..., generator=...), and the GPU/UCI line is validated on 2.8.x.
on:
  push:
  pull_request:
  workflow_dispatch:

env:
  TORCH_SPEC: "torch>=2.1,<3"

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "$TORCH_SPEC" --index-url https://download.pytorch.org/whl/cpu
      - name: Record versions
        run: |
          python -c "import torch, numpy, scipy, sklearn; print('torch', torch.__version__); print('numpy', numpy.__version__); print('scipy', scipy.__version__); print('sklearn', sklearn.__version__)"
      - name: Run tests
        run: python -m pytest test/ -q
